name = "aziel-corpus-download-tracker"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

[[kv_namespaces]]
binding = "DOWNLOADS"
id = "183e17050e204a96a1d8c7e6f54cdf98"

[[d1_databases]]
binding = "DB"
database_name = "aziel-digital-library"
database_id = "23f33238-f1ca-4066-b56e-af66a1e72031"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/download", "/download/*", "/stats", "/event", "/go", "/count", "/install.sh", "/v1", "/v1/*", "/openapi.json", "/login", "/logout", "/signup", "/ingest", "/search", "/health", "/verify", "/map", "/gazetteer", "/historical", "/tree", "/intelligence", "/historical-import", "/comments", "/comments/*", "/robots.txt", "/sitemap.xml", "/cite.json", "/llms.txt", "/ai.txt", "/humans.txt", "/how-its-scored", "/api", "/api/*", "/aziel-library", "/corpus", "/file", "/file/*", "/assets", "/assets/*", "/ocr", "/ocr-selftest", "/ocr-reprocess", "/gazetteer-reindex", "/install-package", "/record", "/record/*", "/receipt", "/receipt/*", "/transcribe", "/ledger", "/ledger/*", "/media", "/media/*", "/derived", "/derived/*", "/spectral-samples", "/spectral-samples/*", "/pattern", "/software", "/about", "/aboutme", "/AzielEliab", "/azieleliab", "/runtime", "/runtime/*", "/sigil.png", "/jeeves-kat-williams.gif"]

[[services]]
binding = "AZIEL_RUNTIME"
service = "aziel-runtime"

[[routes]]
pattern = "www.azielcorpuslibrary.net"
custom_domain = true

[[routes]]
pattern = "azielcorpuslibrary.net"
custom_domain = true

[[kv_namespaces]]
binding = "FILES"
id = "9a28bcf0aa324e1a80716971adcb07b0"

# R2 bucket aziel-digital-library-files is the intended FILES store once the
# account enables R2 in the Cloudflare dashboard (API currently returns 10042).
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "aziel-digital-library-files"

[ai]
binding = "AI"

[triggers]
crons = ["* * * * *"]
