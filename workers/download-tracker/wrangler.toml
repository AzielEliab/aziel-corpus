run_worker_first = ["/", "/download", "/download/*", "/stats", "/event", "/go", "/count", "/install.sh", "/v1", "/v1/*", "/openapi.json", "/login", "/logout", "/signup", "/ingest", "/search", "/health", "/verify", "/map", "/gazetteer", "/historical", "/historical-import", "/comments", "/comments/*", "/robots.txt", "/sitemap.xml", "/cite.json", "/llms.txt", "/api", "/api/*"]

[[routes]]
pattern = "www.azielcorpuslibrary.net"
